imate change and its effects are occurring and are likely to increase over time."], "a": 3}, {"n": 5, "q": "Mark Zuckerberg, Co-Founder and CEO of Facebook spoke with President Barack Obama to discuss about internet privacy impositions by the U.S. government. Zuckerberg said, \"The Internet works because most people and companies do the same. We work together to create this secure environment and make our shared space even better for the world. This is why I've been so confused and frustrated by the repeated reports of the behavior of the U.S. government. When our engineers work tirelessly to improve security, we imagine we're protecting you against criminals, not our own government. The U.S. government should be the champion for the Internet, not a threat. It needs to be much more transparent about what it's doing, or people will believe the worst. I've called President Obama to express my frustration over the damage the government is creating for all of our future. Unfortunately, it seems like it will take a very long time for true full reform. So it's up to us - all of us - to build the Internet we want. Together, we can build a space that is greater and a more important part of the world than anything we have today, but is also safe and secure. I'm committed to seeing this happen, and you can count on Facebook to do our part.\" Why is Internet Privacy very important to all of us?", "o": ["Because it is not safe to trust anyone with our online accounts.", "Because nobody really owns the internet. It is a free space.", "Because it protects and secures not only our online accounts but also our online activities.", "Because the government's protection is not enough."], "a": 2}, {"n": 6, "q": "Search Engine Optimization a.k.a. SEO is vital for a website to stay successful for a long time. The world of internet continues to evolve so website owners must stay in the game by making updates while practicing effective SEO. Great content and correct SEO are the blood of a website because without them, a site could die. The paragraph is mainly about what?", "o": ["The importance of Search Engine Optimization", "The life of a successful website", "The secrets of making a website successful", "How to apply Search Engine Optimization"], "a": 0}, {"n": 7, "q": "There are around 2 million Filipinos without jobs today. That includes graduates and undergraduates. According to survey, there will be another halfmillion to graduate this year without possible job placements. Unemployed people complain about job shortage. Many go to the cities to apply to some companies but end up going home with nothing. Unemployment rate increases each year even though there are many job fairs. The paragraph states that…", "o": ["Unemployment in the Philippines is common", "Unemployment rate in the Philippines is seriously increasing", "Unemployment in the Philippines must be solved", "Unemployment solutions for Filipinos"], "a": 1}, {"n": 8, "q": "\"In the Olympic Peninsula of northwest Washington State, a small town named Forks exists under a near-constant cover of clouds. It rains on this inconsequential town more than any other place in the United States of America. It was from this town and its gloomy, omnipresent shade that my mother escaped with me when I was only a few months old. It was in this town that I'd been compelled to spend a month every summer until I was fourteen. That was the year I finally put my foot down; these past three summers, my dad, Charlie, vacationed with me in California for two weeks instead. It was to Forks that I now exiled myself - an action that I took with great horror. I detested Forks. I loved Phoenix. I loved the sun and the blistering heat. I loved the vigorous, sprawling city.\" -Stephenie Meyer, \"The Twilight Saga\" Provide the specific setting of the story", "o": ["Phoenix", "Rainy day", "Forks, Washington", "Twilight"], "a": 2}, {"n": 9, "q": "\"It's twenty-five after six and the sky still has some shades of purple and orange…oh well just like me, I am standing here, in this secretive rooftop, overjoyed…yet there are still some fragments of fear and haze… I wonder if the sky is glad and excited about the night or if it is crying over the bright day that passed.\" - Fehl Dungo - \"Higher than the Rooftop\" What is the mood of the story?", "o": ["Happiness", "Sorrow", "Confusion", "Grief"], "a": 2}, {"n": 10, "q": "Investing has been a hot topic for quite a while. Many people especially employees and entrepreneurs don't rely on time deposits and regular savings account to save and earn interests. The most common investments in the Philippines are through real estates, mutual funds and trust funds. Although few people also join trading in the stock market, more and more Filipinos are not reluctant to invest their money and diversify them to different money making wheels. What does the article try to convey?", "o": ["Filipinos are now willing to open different investments.", "Filipinos are wise in saving their money.", "Filipinos rely mainly on savings and deposit accounts.", "Filipinos invest in real estates, mutual funds and trust funds."], "a": 0}], "paragraph_org": [{"n": 1, "q": "A. One effective way is to diversify his funds to different investments like real estate, stocks and money instruments like bonds and trust funds. B. It is always best to expand money to different investment wheels. C. A wise investor must not put all his eggs in one basket. D. He should always consider the risks involved in investing his money.", "o": ["CBAD", "CBDA", "CDAB", "CDBA"], "a": 2}, {"n": 2, "q": "A. It is very vital to have social media presence however personal blogs serve as web domains. B. Most people including celebrities and businessmen have blogs nowadays. C. Therefore, building them will help anyone in promoting himself or his business. D. Apparently blogs are like our offices only they are in the internet.", "o": ["BDAC", "BADC", "BACD", "BDCA"], "a": 1}, {"n": 3, "q": "A. The b function buildMockOrder() {
  const target = LEVELS[setup.level].items;
  const avail = {}, order = [];
  let total = 0;
  for (const k of setup.sections) { avail[k] = DATA[k].length; total += avail[k]; }
  const take = Math.min(target, total);
  if (!take) return order;
  const alloc = {};
  let sum = 0;
  const fracs = [];
  for (const k of setup.sections) {
    const f = take * avail[k] / total;
    alloc[k] = Math.min(Math.floor(f), avail[k]);
    sum += alloc[k];
    fracs.push([k, f - alloc[k]]);
  }
  fracs.sort((a, b) => b[1] - a[1]);
  let i = 0;
  while (sum < take) {
    const k = fracs[i % fracs.length][0];
    if (alloc[k] < avail[k]) { alloc[k]++; sum++; }
    i++;
  }
  for (const g of GROUPS) for (const it of g[1]) {
    const k = it[0];
    if (!setup.sections.includes(k)) continue;
    const pool = DATA[k].map((_, p) => p);
    for (let c = 0; c < alloc[k]; c++) {
      const p = Math.floor(Math.random() * pool.length);
      order.push({ sec: k, idx: pool[p] });
      pool.splice(p, 1);
    }
  }
  return order;
}

  let timeLine = '';
  if (quiz.timeTotal > 0) {
    const used = Math.min(quiz.timeUsed, quiz.timeTotal);
    timeLine = '<div class="scoreline">Time used: ' + fmt(used) + ' / ' + fmt(quiz.timeTotal) + (quiz.timeUsed < quiz.timeTotal ? '' : ' &middot; time up') + '</div>';
  }
  let review = '';
  if (wrong.length) {
    review = '<div class="group">Review incorrect answers</div>';
    for (const w of wrong.slice(0, 50)) {
      const q = w.q;
      const letters = q.o.map((_, i) => String.fromCharCode(65 + i));
      review += '<div class="review"><div class="rq">' + esc(SECNAMES[w.sec]) + ' &middot; Q' + q.n + '. ' + esc(q.q) + '</div>' +
        '<div class="ra">&#10003; ' + letters[q.a] + '. ' + esc(q.o[q.a]) + '</div></div>';
    }
    if (wrong.length > 50) review += '<div class="small">...and ' + (wrong.length - 50) + ' more.</div>';
  } else if (answered > 0) {
    review = '<div class="fb good" style="margin-top:14px">&#127942; Perfect score! Great job.</div>';
  }
  const notes = unanswered ? '<div class="small" style="margin-top:8px">' + unanswered + ' unanswered' + (isMock ? ' (counted as wrong, like the real exam)' : '') + '</div>' : '';
  return '<div class="topline"><button class="btn ghost2" onclick="quit()">&#9776; Home</button>' +
         '<span class="spacer"></span>' +
         '<button class="btn ghost2" onclick="retry()">Retry</button></div>' +
         '<div class="summary-box"><div class="big ' + cls + '">' + pct + '%</div>' +
         '<div class="scoreline">' + correct + ' correct out of ' + denom + (isMock ? ' items' : ' answered') + '</div>' +
         timeLine + passbar + notes + '</div>' +
         review;
}

render();
</script>
</body>
</html>
