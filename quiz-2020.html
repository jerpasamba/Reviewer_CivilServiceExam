<style>

  .theme {

  .est {

h the status of the western world", "needy countries spend so much time for conducting researchers"], "a": 3}, {"n": 73, "q": "Critical reading is a demanding process. To read critically, you must slow down your reading and, with pencil in hand, perform specific operations on the text. Mark up the text with your reactions, conclusions, and questions. When you read, become an active participant. This paragraph best supports the statement that", "o": ["critical reading is a slow, dull, but essential process.", "the best critical reading happens at critical times in a person's life.", "readers should get in the habit of questioning the truth of what they read.", "critical reading requires thoughtful and careful attention.", "critical reading should take place at the same time each day."], "a": 3}, {"n": 74, "q": "Two person look out through the same bars; one sees mud and the other, the stars. The sentence best supports the statement that __________.", "o": ["some people are more blind than others", "people see things differently depending on their own perspective", "people have varied ways of looking at different things", "people have different tastes and interests", "people tend to influence one another's views of things"], "a": 2}, {"n": 75, "q": "Nagawang mabago ng mga kasalukuyang awitin ang kamalayan ng Pilipino upang kantahin ang sarili niyang mga awit sa tanging wikang nakapagsasatinig sa kanyang kaluluwa. Isinasaad ng pangungusap na __________.", "o": ["madamdamin at makabuluhan ang mga awiting isinulat sa wikang Pilipino", "tagumpay ang mga awiting Pilipino na mabago ang kaugalian ng mga tao Pilipino", "madaling matutuhan ang mga awiting Pilipino dahil ang mga ito ay nasusulat sa katutubong wika", "natututuhan nang tangkilikin ng mga Pilipino ang kanilang mga sariling awitin", "nagkakaroon na ng kamalayan ang mga Pilipino tungkol sa lahat ng mga awitin ngayon"], "a": 3}, {"n": 76, "q": "Sixty years ago I know everything ; now I know nothing ; education is a p   const take = Math.min(target, total);
  if (!take) return order;
  const alloc = {};
  let sum = 0;
  const fracs = [];
  for (const k of setup.sections) {
    const f = take * avail[k] / total;
    alloc[k] = Math.min(Math.floor(f), avail[k]);
    sum += alloc[k];
    fracs.push([k, f - alloc[k]]);
  }
  fracs.sort((a, b) => b[1] - a[1]);
  let i = 0;
  while (sum < take) {
    const k = fracs[i % fracs.length][0];
    if (alloc[k] < avail[k]) { alloc[k]++; sum++; }
    i++;

  for (const g of GROUPS) for (const it of g[1]) {

  const pct = Math.round(correct / denom * 100);
  const cls = pct >= 80 ? 'good' : pct >= 50 ? 'mid' : 'bad';
  const pass = pct >= 80;
  let passbar = '';
  if (answered > 0 || isMock) {
    passbar = '<div class="passbar ' + (pass ? 'pass' : 'fail') + '">' +
      (pass ? '&#127942; Passed &mdash; rating ' + pct + '% (need 80%)' : 'Below the passing rating (80%). Keep reviewing!') + '</div>';
  }
  let timeLine = '';
  if (quiz.timeTotal > 0) {
    const used = Math.min(quiz.timeUsed, quiz.timeTotal);
    timeLine = '<div class="scoreline">Time used: ' + fmt(used) + ' / ' + fmt(quiz.timeTotal) + (quiz.timeUsed < quiz.timeTotal ? '' : ' &middot; time up') + '</div>';
  }
  let review = '';
  if (wrong.length) {
    review = '<div class="group">Review incorrect answers</div>';
    for (const w of wrong.slice(0, 50)) {
      const q = w.q;
      const letters = q.o.map((_, i) => String.fromCharCode(65 + i));
      review += '<div class="review"><div class="rq">' + esc(SECNAMES[w.sec]) + ' &middot; Q' + q.n + '. ' + esc(q.q) + '</div>' +
        '<div class="ra">&#10003; ' + letters[q.a] + '. ' + esc(q.o[q.a]) + '</div></div>';
    }
    if (wrong.length > 50) review += '<div class="small">...and ' + (wrong.length - 50) + ' more.</div>';
  } else if (answered > 0) {
    review = '<div class="fb good" style="margin-top:14px">&#127942; Perfect score! Great job.</div>';
  }
  const notes = unanswered ? '<div class="small" style="margin-top:8px">' + unanswered + ' unanswered' + (isMock ? ' (counted as wrong, like the real exam)' : '') + '</div>' : '';
  return '<div class="topline"><button class="btn ghost2" onclick="quit()">&#9776; Home</button>' +
         '<span class="spacer"></span>' +
         '<button class="btn ghost2" onclick="retry()">Retry</button></div>' +
         '<div class="summary-box"><div class="big ' + cls + '">' + pct + '%</div>' +
         '<div class="scoreline">' + correct + ' correct out of ' + denom + (isMock ? ' items' : ' answered') + '</div>' +
         timeLine + passbar + notes + '</div>' +
         review;
}

render();
</script>
</body>
</html>
